<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin REAL Mpesa</title><style>body{font-family:system-ui;padding:14px;background:#0f172a;color:#fff;max-width:600px;margin:auto}.card{background:#1e293b;padding:12px;border-radius:12px;margin:8px 0;border:1px solid #334155}button{background:#22c55e;padding:10px;border:none;border-radius:8px;font-weight:800;margin:4px}</style></head><body><h2>Admin - REAL Mpesa Sender</h2><button onclick="load()">🔄 Refresh Requests</button><div id="list">Loading...</div><script>const DB="https://lingotask-real-default-rtdb.firebaseio.com/withdrawals";async function load(){let d=await (await fetch(DB+".json")).json();let h="";if(!d){document.getElementById("list").innerHTML="No REAL requests yet";return;}Object.keys(d).reverse().forEach(k=>{let w=d[k];if(!w)return;h+=`<div class=card><b>${w.phone}</b> - $${w.amount}<br>Status: ${w.status}<br><small>${w.time||""}</small><br><button onclick="mark('${k}','paid')">✅ I Sent REAL Mpesa $${w.amount}</button> <button style="background:#ef4444;color:#fff" onclick="mark('${k}','rejected')">❌ Reject</button></div>`});document.getElementById("list").innerHTML=h;}async function mark(id,st){await fetch(DB+"/"+id+"/status.json",{method:"PUT",body:JSON.stringify(st)});alert("Marked "+st+" - Send REAL money from Safaricom NOW!");load();}load();setInterval(load,10000);</script></body></html>
