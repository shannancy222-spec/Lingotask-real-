<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lingotask REAL</title><style>body{font-family:system-ui;padding:16px;background:#0f172a;color:#fff;max-width:480px;margin:auto}.card{background:#1e293b;padding:14px;border-radius:14px;margin:10px 0;border:1px solid #334155}button{background:#22c55e;color:#000;padding:12px;border:none;border-radius:10px;font-weight:800;width:100%;margin-top:8px}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;box-sizing:border-box}.top{display:flex;justify-content:space-between;background:#1e293b;padding:12px;border-radius:12px}</style></head><body><h2>🌍 Lingotask REAL</h2><div class="top"><span>Bal: $<b id="bal">5</b></span><span id="ph">07xx</span></div><div id="tasks">Loading REAL DB...</div><h3>💰 Withdraw REAL Mpesa</h3><div class="card"><input id="mpesa" placeholder="Your Mpesa 07xxxxxxxx"><input id="amount" type="number" placeholder="Amount $ min 1"><button onclick="requestWithdraw()">Request REAL Mpesa</button><div id="myW"></div></div><script>const DB="https://lingotask-real-default-rtdb.firebaseio.com";let balance=5;async function load(){let d=await (await fetch(DB+"/.json")).json();let h="";if(d){Object.keys(d).forEach(k=>{if(k=="withdrawals")return;let t=d[k];if(!t)return;let title=t.Title||k;let pay=t.Payment||5;h+=`<div class=card><b>${title}</b> - $${pay}<br><button onclick="complete(${pay})">Complete & Earn $${pay}</button></div>`;})}document.getElementById("tasks").innerHTML=h||"Add tasks in Firebase";}function complete(p){balance+=Number(p);document.getElementById("bal").innerText=balance;alert("Earned $"+p+"! Now withdraw");}async function requestWithdraw(){let phone=document.getElementById("mpesa").value;let amt=document.getElementById("amount").value;if(phone.length<10)return alert("Enter 07xx");if(amt<1)return alert("Min $1");let req={phone,amount:Number(amt),status:"pending",time:new Date().toISOString()};await fetch(DB+"/withdrawals/"+Date.now()+".json",{method:"PUT",body:JSON.stringify(req)});balance-=Number(amt);document.getElementById("bal").innerText=balance;alert("REAL Request Sent! Admin will send REAL Mpesa to "+phone);}load();</script></body></html>
